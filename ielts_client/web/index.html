<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Master - 剑桥雅思机考模拟与练习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23c8102e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-m">
  <header class="topbar">
    <div class="brand"><span class="logo">IELTS</span><span class="brand-name">Master</span></div>
    <label class="test-picker">
      <span class="sr">选择套题</span>
      <select id="test-select" title="选择套题"></select>
    </label>
    <div class="seg" id="module-seg" role="tablist">
      <button data-module="listening">听力 Listening</button>
      <button data-module="reading">阅读 Reading</button>
    </div>
    <div class="seg" id="mode-seg" role="tablist">
      <button data-mode="mock">全真模考</button>
      <button data-mode="study">日常练习</button>
    </div>
    <div class="spacer"></div>
    <div class="timer" id="timer">
      <span id="timer-label">--</span>
      <b id="timer-value">--:--</b>
      <button class="btn tiny ghost" id="btn-timer-pause" hidden>暂停</button>
    </div>
    <button class="btn ghost" id="btn-font" title="字号">A<small>A</small></button>
    <button class="btn ghost" id="btn-history">历史成绩</button>
    <button class="btn primary" id="btn-submit">交卷</button>
  </header>

  <div class="playerbar" id="playerbar" hidden>
    <div class="pb-study" id="pb-study">
      <button class="btn small" id="pb-play">▶ 播放</button>
      <button class="btn small ghost" data-seek="-5">−5s</button>
      <button class="btn small ghost" data-seek="5">+5s</button>
      <span class="pb-time" id="pb-cur">00:00</span>
      <input type="range" id="pb-seek" min="0" max="1000" value="0" aria-label="进度">
      <span class="pb-time" id="pb-dur">00:00</span>
      <label class="pb-field">倍速
        <select id="pb-rate">
          <option value="0.75">0.75x</option><option value="0.9">0.9x</option><option value="1" selected>1.0x</option>
          <option value="1.1">1.1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
        </select>
      </label>
      <button class="btn small ghost" id="pb-ab" title="AB 段循环：第一次点击设 A 点，第二次设 B 点，第三次取消">AB 循环</button>
      <button class="btn small ghost" id="pb-transcript">📜 原文</button>
    </div>
    <div class="pb-mock" id="pb-mock" hidden>
      <span class="live-dot"></span><span id="pb-mock-text">等待开始</span>
    </div>
    <label class="pb-field vol">🔊<input type="range" id="pb-vol" min="0" max="1" step="0.05" value="1" aria-label="音量"></label>
    <div class="pb-error" id="pb-error" hidden></div>
  </div>

  <main id="main" class="main">
    <section id="pane-a" class="pane pane-a"></section>
    <div id="resizer" class="resizer" title="拖动调整宽度"></div>
    <section id="pane-b" class="pane pane-b"></section>
  </main>

  <footer class="navbar">
    <div class="nav-parts" id="nav-parts"></div>
    <div class="nav-actions">
      <button class="btn small ghost" id="btn-flag" title="标记当前题目，稍后复查">☆ 标记复查</button>
      <button class="btn small ghost" id="btn-prev" title="上一题">‹</button>
      <button class="btn small ghost" id="btn-next" title="下一题">›</button>
    </div>
  </footer>

  <div class="overlay" id="overlay" hidden><div class="overlay-card" id="overlay-card"></div></div>

  <div class="modal" id="modal-report" hidden>
    <div class="modal-card wide">
      <div class="modal-head"><h2>成绩报告</h2><button class="btn ghost" data-close>×</button></div>
      <div class="modal-body" id="report-body"></div>
    </div>
  </div>

  <div class="modal" id="modal-history" hidden>
    <div class="modal-card wide">
      <div class="modal-head"><h2>历史成绩</h2><button class="btn ghost" data-close>×</button></div>
      <div class="modal-body" id="history-body"></div>
    </div>
  </div>

  <div class="hl-toolbar" id="hl-toolbar" hidden>
    <button data-hl="add">高亮</button><button data-hl="clear">清除本页高亮</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <audio id="audio" preload="auto"></audio>

  <script src="js/scoring.js"></script>
  <script src="js/render.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
